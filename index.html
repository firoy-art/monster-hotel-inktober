<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel of Monsters — Inktober</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#16111d;
  color:#f5efe7;
  font-family:Arial,sans-serif;
}
.page{
  width:min(1200px,96vw);
  margin:auto;
  padding:34px 0 60px;
}
header{text-align:center;margin-bottom:26px}
h1{margin:0;font:700 clamp(34px,6vw,68px)/1 Georgia,serif;letter-spacing:.07em}
.subtitle{margin-top:10px;opacity:.65}

.hotel{
  background:#392b46;
  border:5px solid #0d0910;
  border-radius:18px;
  padding:20px;
}
.sign{
  width:max-content;
  margin:0 auto 20px;
  padding:10px 20px;
  background:#24192e;
  border:3px solid #0d0910;
  border-radius:8px;
  font-weight:700;
  letter-spacing:.15em;
}
.floors{display:grid;gap:14px}
.floor{
  background:#4a3858;
  border:3px solid #18101f;
  border-radius:9px;
  padding:12px;
}
.floor-name{
  font-size:11px;
  opacity:.6;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:7px;
}
.rooms{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:8px;
  align-items:end;
}
.room{
  position:relative;
  height:150px;
  min-width:0;
}
.room.open{z-index:20}

.door-button{
  position:absolute;
  inset:0;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  overflow:visible;
}
.door-img{
  position:absolute;
  object-fit:contain;
  object-position:bottom center;
  pointer-events:none;
  user-select:none;
}
.closed-img{
  width:78%;
  height:96%;
  left:11%;
  bottom:0;
}
.open-img{
  display:none;
  width:150%;
  height:103%;
  left:-47%;
  bottom:-1%;
  max-width:none;
  z-index:5;
}
.room.open .closed-img{display:none}
.room.open .open-img{display:block}

.door-label{
  position:absolute;
  z-index:8;
  left:50%;
  top:30%;
  width:44%;
  transform:translateX(-50%);
  text-align:center;
  color:#f9eaff;
  text-shadow:0 1px 3px #000,0 0 7px #000;
  pointer-events:none;
}
.door-label .day{
  display:block;
  font-size:9px;
  letter-spacing:.08em;
  opacity:.72;
  margin-bottom:5px;
}
.door-label .title{
  display:block;
  font-size:clamp(8px,.82vw,12px);
  font-weight:700;
  line-height:1.08;
}
.room.open .door-label{display:none}

.inside-text{
  position:absolute;
  z-index:3;
  left:24%;
  bottom:17%;
  width:53%;
  height:57%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:6px;
  text-align:center;
  color:white;
  opacity:0;
  pointer-events:none;
}
.room.open .inside-text{opacity:1}
.inside-text .day{
  font-size:9px;
  letter-spacing:.08em;
  opacity:.65;
  margin-bottom:5px;
}
.inside-text .title{
  font-size:clamp(8px,.85vw,12px);
  font-weight:700;
  line-height:1.1;
}

.room:not(.open):hover .closed-img{
  filter:brightness(1.15) drop-shadow(0 0 6px rgba(195,120,255,.4));
  transform:translateY(-2px);
}

.hint{
  text-align:center;
  margin-top:16px;
  opacity:.55;
  font-size:13px;
}

@media(max-width:820px){
  .rooms{grid-template-columns:repeat(4,1fr)}
  .room{height:165px}
}
@media(max-width:460px){
  .hotel{padding:10px}
  .rooms{grid-template-columns:repeat(3,1fr)}
  .room{height:145px}
}
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Hotel of Monsters</h1>
    <div class="subtitle">INKTOBER CHALLENGE · выбери любую комнату</div>
  </header>

  <section class="hotel">
    <div class="sign">MONSTER HOTEL</div>
    <div class="floors" id="floors"></div>
  </section>

  <div class="hint">Клик — открыть дверь. Второй клик — закрыть.</div>
</main>

const themes = Array.from({length:31}, (_,i)=>({
  day:i+1,
  title:`Тема ${i+1}`
}));

const floorGroups = [
  {name:"4 этаж", items:themes.slice(23,31)},
  {name:"3 этаж", items:themes.slice(15,23)},
  {name:"2 этаж", items:themes.slice(7,15)},
  {name:"1 этаж", items:themes.slice(0,7)}
];

const floors = document.getElementById("floors");

function createRoom(theme){
  const room = document.createElement("div");
  room.className = "room";

  room.innerHTML = `
    <div class="inside-text">
      <span class="day">DAY ${String(theme.day).padStart(2,"0")}</span>
      <span class="title">${theme.title}</span>
    </div>

    <button class="door-button" type="button" aria-label="Комната ${theme.day}">
      <img class="door-img closed-img" src="${CLOSED_IMAGE}" alt="">
      <img class="door-img open-img" src="${OPEN_IMAGE}" alt="">
      <span class="door-label">
        <span class="day">DAY ${String(theme.day).padStart(2,"0")}</span>
        <span class="title">${theme.title}</span>
      </span>
    </button>
  `;

  room.querySelector(".door-button").addEventListener("click", ()=>{
    room.classList.toggle("open");
  });

  return room;
}

for(const group of floorGroups){
  const floor = document.createElement("section");
  floor.className = "floor";
  floor.innerHTML = `<div class="floor-name">${group.name}</div><div class="rooms"></div>`;
  const grid = floor.querySelector(".rooms");
  group.items.forEach(theme=>grid.appendChild(createRoom(theme)));
  floors.appendChild(floor);
}
</script>
</body>
</html>
